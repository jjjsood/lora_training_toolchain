[project]
name = "lorafactory"
version = "0.1.0"
description = "LoRA training toolchain for the matched-budget SD3/FLUX thesis instrument"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2",
    "pyyaml>=6",
    "numpy>=1.26",
    "torch>=2.2",
    "safetensors>=0.4",
    "diffusers==0.39.0",
    "transformers>=4.40",
    "peft>=0.10",
    "tomli-w>=1.0",
    "pillow>=10",
    "lpips>=0.1.4",
    "huggingface_hub>=0.22",
    # Hugging Face image datasets ship as parquet; data/fetch.py reads the image
    # column directly rather than pulling in the whole `datasets` library.
    "pyarrow>=17",
]

[project.scripts]
lorafactory = "lorafactory.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorafactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA GPU + local model weights; excluded by default"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit rule set: ruff's default is only E4/E7/E9/F, which silently skips
# line length, import order, and the pyupgrade/pylint findings.
select = ["E", "F", "I", "UP", "B", "PL"]

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal expected values and import heavy optional deps
# (torch, diffusers) inside the test body to keep collection fast and offline.
"tests/*" = ["PLR2004", "PLC0415", "PLR0913", "PLR0917"]
# One-shot dev script that walks sd-scripts' argparse trees.
"tools/*" = ["PLR0912"]
